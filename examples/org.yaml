---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-user
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
spec:
  memberOf: [guests]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-group
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: guests
spec:
  type: team
  children: []
---
# Real users. GitHub login works ONLY for users listed here: the user's
# metadata.name must equal their GitHub username (resolver usernameMatchingUserEntityName).
# Onboarding (later): a Backstage template adds new people here.
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: jacer7                      # GitHub username Jacer7
spec:
  profile:
    displayName: Jayshwor Khadka
    email: jsor.khadka@everesto.live
  memberOf: [platform-team]
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
  description: Runs the everesto.live platform (K3s, monitoring, CI/CD)
spec:
  type: team
  profile:
    email: dev@everesto.live
  children: []
