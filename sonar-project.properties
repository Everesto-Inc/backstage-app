# SonarQube analysis of Backstage itself (project backstage-app on https://sonar.everesto.live).
sonar.projectKey=backstage-app
sonar.projectName=backstage-app
sonar.sources=packages/app/src,packages/backend/src
sonar.tests=packages/app/src,packages/backend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/dist/**,**/node_modules/**
# coverage: added once tests run with --coverage (coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
