# Production — Backstage on K3s at https://backstage.everesto.live
# Loaded ON TOP of app-config.yaml. ${...} values come from environment variables,
# which come from a Kubernetes secret (never committed).

app:
  baseUrl: https://backstage.everesto.live

backend:
  baseUrl: https://backstage.everesto.live
  # Object form, same as app-config.yaml: the Helm chart also injects
  # APP_CONFIG_backend_listen_port, which makes backend.listen an object —
  # a string here crashes startup ("got string, wanted object").
  listen:
    port: 7007
  cors:
    origin: https://backstage.everesto.live
  # Tighten the base config's permissive dev CSP (which allows connecting to any
  # http:/https: host). In production the browser may only talk back to Backstage
  # itself + GitHub (OAuth/avatars). This limits data exfiltration if a stored-XSS
  # bug (e.g. via TechDocs) ever lands. Add hosts here as plugins need them.
  csp:
    default-src: ["'self'"]
    connect-src:
      - "'self'"
      - https://api.github.com
      - https://github.com
    img-src:
      - "'self'"
      - 'data:'   # quoted — bare `data:` is parsed as a YAML key, not a string
      - https://avatars.githubusercontent.com
  # External PostgreSQL — host + password come from Infisical (via ESO).
  database:
    client: pg
    # ONE database "backstage", one schema per plugin (default would create ~10 databases)
    pluginDivisionMode: schema
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: backstage
      # TLS with full verification. The Postgres server cert is self-signed, so we
      # pin its CA (the server cert itself, acting as its own CA) and verify against
      # it. This stops an on-path attacker from impersonating the DB and capturing
      # POSTGRES_PASSWORD over the public OCI↔GCP hop.
      #
      # The CA PEM comes from Infisical key POSTGRES_CA → ESO → k8s secret
      # backstage-secrets → mounted read-only at the path below (gitops-backstage/values.yaml).
      # If the file is missing the backend fails fast at startup rather than silently
      # falling back to an unverified connection.
      ssl:
        rejectUnauthorized: true
        ca:
          $file: /etc/backstage/postgres/ca.crt
    # Each plugin gets its own pool. The shared Postgres allows only 30 connections
    # (Infisical uses it too). 2 per plugin × ~13 plugins hit the limit at startup
    # ("remaining connection slots are reserved") → 1 per plugin, 2 for catalog +
    # scaffolder (parallel queries) ≈ 15 at peak; idle connections closed after 10 s.
    knexConfig:
      pool:
        min: 0
        max: 1
        idleTimeoutMillis: 10000
    plugin:
      catalog:
        knexConfig: { pool: { min: 0, max: 2, idleTimeoutMillis: 10000 } }
      scaffolder:
        knexConfig: { pool: { min: 0, max: 2, idleTimeoutMillis: 10000 } }

auth:
  environment: production
  providers:
    # GitHub OAuth App: callback URL https://backstage.everesto.live/api/auth/github/handler/frame
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # GitHub username must match a User entity (everesto-catalog/platform/org.yaml) — anyone else is refused
            - resolver: usernameMatchingUserEntityName

# GitHub = the GitHub App "backstage-tailored" installed on Everesto-Inc (no personal token).
# Used to read the private catalog repo and (Software Templates) to create repos.
# Values from Infisical backstage/prod via ESO (gitops-backstage ExternalSecret).
integrations:
  github:
    - host: github.com
      apps:
        - appId: ${GITHUB_APP_ID}
          clientId: ${GITHUB_APP_CLIENT_ID}
          clientSecret: ${GITHUB_APP_CLIENT_SECRET}
          privateKey: ${GITHUB_APP_PRIVATE_KEY}
          webhookSecret: ${GITHUB_APP_WEBHOOK_SECRET}
          allowedInstallationOwners: [Everesto-Inc]

# SonarQube Community on the tools node (public: sonar.everesto.live).
# Token = SonarQube user backstage-bot (Infisical SONARQUBE_TOKEN → ESO).
sonarqube:
  baseUrl: https://sonar.everesto.live
  apiKey: ${SONARQUBE_TOKEN}

catalog:
  locations:
    # everesto.live catalog — private repo, read through the GitHub App above.
    # Changes there show up within minutes, no image rebuild.
    - type: url
      target: https://github.com/Everesto-Inc/everesto-catalog/blob/main/all.yaml
      rules:
        - allow: [Location, Domain, System, Component, Resource, API, Group, User, Template]
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

# Infisical — "Create deployment" creates per project: Infisical project, folders, ESO identity.
# Backstage logs in as machine identity "backstage-platform" (org: create projects + identities).
# Until these env vars exist, the Infisical part is skipped (deployment still works).
infisical:
  url: https://infisical.everesto.live
  clientId: ${INFISICAL_CLIENT_ID}
  clientSecret: ${INFISICAL_CLIENT_SECRET}
  organizationId: ${INFISICAL_ORG_ID}

# TechDocs: build docs inside the pod with the mkdocs venv baked into the image (/opt/techdocs) — no Docker in K3s.
techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

# Kubernetes tab + ArgoCD status: Backstage runs IN the cluster and uses its own ServiceAccount
# (prod-backstage/backstage) — READ-ONLY ClusterRole gitops-backstage/platform/backstage-k8s-readonly.yaml.
# No serviceAccountToken here: the backend uses the token mounted into the pod.
kubernetes:
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: k3s
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          caFilePath: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          skipMetricsLookup: false
