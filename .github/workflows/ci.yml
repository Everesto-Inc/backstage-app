# Build Backstage → ghcr.io (linux/arm64, the A1 nodes) → bump the tag in gitops-backstage → ArgoCD deploys.
# Same pattern as my_portfolio. Secret needed: GITOPS_PAT (fine-grained, contents:write on gitops-backstage only).
#
# Speed:    native arm64 runner (no QEMU), cached yarn + node_modules + tsc incremental, tsc ‖ build in parallel,
#           Docker layer cache (gha).
# Security: actions pinned to commit SHAs, yarn audit gate (high+), Trivy image scan BEFORE anything is pushed.
name: CI

on:
  push:
    branches: [main]
    # docs-only commits don't rebuild/redeploy (and can't cancel a push in progress)
    paths-ignore: ['**.md', 'docs/**', 'mkdocs.yml', 'catalog-info.yaml']
  workflow_dispatch:

# A newer push to main cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: everesto-inc/backstage # ghcr.io needs lowercase; the org is Everesto-Inc

jobs:
  build-and-push:
    name: Build, scan & push linux/arm64 image
    # Native ARM runner: the image is built without QEMU emulation (native modules compile ~10x faster).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # full history: SonarQube "new code"

      # Backstage builds the backend OUTSIDE Docker (needs lots of RAM — never on our VMs)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable

      - name: Cache yarn + node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.yarn/berry/cache
            node_modules
            packages/*/node_modules
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-${{ runner.arch }}-

      - run: yarn install --immutable

      # Fails on any high/critical advisory. Accepted exceptions live in .yarnrc.yml (npmAuditIgnoreAdvisories).
      - name: Dependency audit
        run: yarn npm audit --all --recursive --severity high

      - name: Cache tsc incremental build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist-types
          key: tsc-${{ runner.arch }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.arch }}-

      # tsc and the backend build are independent → run them at the same time; fail if either fails.
      - name: Type-check + build backend (parallel)
        run: |
          yarn tsc & TSC=$!
          yarn build:backend & BUILD=$!
          wait $TSC; TSC_RC=$?
          wait $BUILD; BUILD_RC=$?
          exit $(( TSC_RC || BUILD_RC ))

      - name: Tests + coverage
        run: CI=true yarn backstage-cli repo test --coverage   # → coverage/lcov.info (read by SonarQube)

      # SonarQube: analysis + report on https://sonar.everesto.live (project backstage-app).
      # Gate NOT blocking yet (coverage is still low → the default gate's 80 % new-code coverage would fail most builds).
      # Make it blocking later: -Dsonar.qualitygate.wait=true. Token = repo secret SONAR_TOKEN (project analysis token).
      - name: SonarQube token available?
        id: sonar
        run: echo "has_token=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # the scanner runs on the job's Node.js — SonarQube recommends the current LTS (24). Build above stays on .nvmrc.
      - name: Node 24 for the SonarQube scanner
        if: steps.sonar.outputs.has_token == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24' }
      - name: Code quality (SonarQube)
        if: steps.sonar.outputs.has_token == 'true'
        continue-on-error: true   # report-only for Backstage itself: a SonarQube/network hiccup must not block the image
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}        # only this step sees it
          SONAR_HOST_URL: https://sonar.everesto.live
        with:
          args: -Dsonar.qualitygate.wait=false

      - name: Image tag = short commit SHA
        id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build into the local Docker daemon only — nothing leaves the runner until the scan passes.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails the pipeline on HIGH/CRITICAL vulnerabilities that have a fix available
      # (OS packages + node_modules). Accepted exceptions live in .trivyignore.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push --all-tags "${REGISTRY}/${IMAGE_NAME}"

  update-gitops:
    name: Update image tag in gitops-backstage
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/gitops-backstage
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-backstage
      - name: Bump the image tag in apps/prod/values.yaml
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          sed -i -E "s|^(\s*tag:\s*).*$|\1\"${TAG}\"|" gitops-backstage/apps/prod/values.yaml
          cd gitops-backstage
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/prod/values.yaml
          git diff --cached --quiet || git commit -m "chore: backstage image → ${TAG}"
          git push
